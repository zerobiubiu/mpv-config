# ==================================================
# uosc 界面
# ==================================================

# 鼠标右键打开 uosc 主菜单
mbtn_right script-binding uosc/menu

# 显示或隐藏整个 uosc 界面
tab script-binding uosc/toggle-ui

# 打开文件浏览器
o script-binding uosc/open-file

# 有播放列表时打开播放列表，否则浏览当前目录
p script-binding uosc/items

# 字幕、音轨、章节菜单
s script-binding uosc/subtitles
a script-binding uosc/audio
c script-binding uosc/chapters

# 显示当前所有快捷键
F1 script-binding uosc/keybinds

# ==================================================
# 禁用默认数字键
# 1 / 2  调整对比度
# 3 / 4  调整亮度
# 5 / 6  调整 Gamma
# 7 / 8  调整饱和度
# 9 / 0  调整音量
# ==================================================

0 ignore
1 ignore
2 ignore
3 ignore
4 ignore
5 ignore
6 ignore
7 ignore
8 ignore
9 ignore

# ==================================================
# 数字键固定倍速
# ==================================================

# 按数字直接切换到对应倍速
0 no-osd set speed 0.5; script-binding uosc/flash-speed
1 no-osd set speed 1; script-binding uosc/flash-speed
2 no-osd set speed 2; script-binding uosc/flash-speed
3 no-osd set speed 3; script-binding uosc/flash-speed
4 no-osd set speed 4; script-binding uosc/flash-speed
5 no-osd set speed 5; script-binding uosc/flash-speed
6 no-osd set speed 6; script-binding uosc/flash-speed
7 no-osd set speed 7; script-binding uosc/flash-speed
8 no-osd set speed 8; script-binding uosc/flash-speed
9 no-osd set speed 9; script-binding uosc/flash-speed

# ==================================================
# 禁用 - 和 = 的组合键
# Ctrl+-   原默认：减少音频延迟
# Ctrl++   原默认：增加音频延迟
# Alt+-    原默认：缩小画面
# Alt++    原默认：放大画面
# _        原默认：切换视频轨道
# ==================================================

# Shift+- 和 Shift+=
_ ignore
+ ignore

# Ctrl 组合
Ctrl+- ignore
Ctrl+= ignore
Ctrl+_ ignore
Ctrl++ ignore

# Alt 组合
Alt+- ignore
Alt+= ignore
Alt+_ ignore
Alt++ ignore

# Ctrl+Alt 组合
Ctrl+Alt+- ignore
Ctrl+Alt+= ignore
Ctrl+Alt+_ ignore
Ctrl+Alt++ ignore


# ==================================================
# 播放控制
# ==================================================

# 播放或暂停
SPACE cycle pause; script-binding uosc/flash-pause-indicator

# 短按：前后跳转
# 长按：左键慢放 右键倍速
# 松开：恢复长按前的播放速度
LEFT script-binding hold_speed/left
RIGHT script-binding hold_speed/right

# Ctrl+LEFT  → 回退到上一条字幕出现的时间
# Ctrl+RIGHT → 前进到下一条字幕出现的时间

# Shift+右方向键：前进一帧
Shift+RIGHT frame-step
# Shift+左方向键：后退一帧
Shift+LEFT frame-back-step

# 上一个、下一个视频
< script-binding uosc/prev; script-message-to uosc flash-elements top_bar,timeline
> script-binding uosc/next; script-message-to uosc flash-elements top_bar,timeline


# ==================================================
# 音量
# ==================================================

# 调整音量
UP no-osd add volume 5; script-binding uosc/flash-volume
DOWN no-osd add volume -5; script-binding uosc/flash-volume

# 静音
m no-osd cycle mute; script-binding uosc/flash-volume


# ==================================================
# 播放速度
# ==================================================

# 取消 [ 和 ] 的默认调速功能
[ ignore
] ignore

# 每次降低或提高 0.1 倍
- no-osd add speed -0.1; script-binding uosc/flash-speed
= no-osd add speed 0.1; script-binding uosc/flash-speed

# 恢复正常速度
BS no-osd set speed 1; script-binding uosc/flash-speed

# ==================================================
# 字幕调整
# ==================================================

# 调整字幕时间，让上一条或下一条字幕在当前位置显示。
Ctrl+Shift+LEFT  sub-step -1
Ctrl+Shift+RIGHT sub-step 1

# 字幕提前或延后 0.1 秒
z add sub-delay -0.1
Z add sub-delay 0.1

# 调整字幕大小
Ctrl+UP add sub-scale 0.1
Ctrl+DOWN add sub-scale -0.1


# ==================================================
# 窗口与其他操作
# ==================================================

# 全屏切换
Alt+ENTER cycle fullscreen

# 截图
Ctrl+s async screenshot

# 禁用单独按 Q 退出
q ignore

# Ctrl+Q 退出
Ctrl+q quit

# 无记录退出：不保存本次状态，并删除当前视频已有的恢复记录
Ctrl+Alt+q script-binding quit_no_record/quit

# 清除所有常用播放调整
Alt+BS no-osd set speed 1; no-osd set audio-delay 0; no-osd set sub-delay 0; no-osd set sub-scale 1; no-osd set video-zoom 0; no-osd set panscan 0; no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0; no-osd set contrast 0; no-osd set brightness 0; no-osd set gamma 0; no-osd set saturation 0; no-osd set hue 0; script-binding uosc/flash-speed; show-text "已清除全部播放调整"

# ESC：全屏时退出全屏；窗口时触发老板键
ESC script-binding boss_key/escape