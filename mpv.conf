# ==================================================
# 视频播放
# ==================================================
# 内置高质量配置
profile = high-quality
# 自动使用安全的硬件解码（d3d11va 等）
hwdec = auto-safe
# 关闭 mpv 原生控制界面，由 uosc 接管
osc = no
# 禁止 mpv 原生进度条与 uosc 提示重叠
osd-bar = no
# 关闭系统边框，由 uosc 绘制顶部栏和窗口按钮
border = no
# 播放结束后保留最后一帧
keep-open = yes
# 退出时自动保存播放进度
save-position-on-quit = yes
# 续播记录中不包含音频延迟与画面缩放
watch-later-options-remove = audio-delay,video-zoom
# 窗口最大不超过屏幕的 90%
autofit-larger = 90%x90%
# 1.5 秒后隐藏鼠标
cursor-autohide = 1500
# ==================================================
# 音频
# ==================================================
# 防止音量拉得过高
volume-max = 100
# 中文优先，然后日语、英语
alang = zh-CN,zh-Hans,zh,zho,chi,ja,jpn,en,eng
# 自动加载同目录下的外部音频
audio-file-auto = fuzzy
# 常驻音频变速滤镜，避免变速时滤镜插拔产生轻微卡顿
af = scaletempo2
# ==================================================
# 字幕
# ==================================================
# 字幕语言优先级
slang = zh-CN,zh-Hans,zh,zho,chi,en,eng
# 自动加载文件名相近的字幕
sub-auto = fuzzy
# 常见字幕子目录
sub-file-paths = sub:subs:subtitle:subtitles
# 普通文本字幕字体
sub-font = Maple Mono Normal NF CN
# 字幕大小
sub-font-size = 42
# 字幕描边
sub-border-size = 2
# 字幕纵向位置
sub-pos = 92
# 保留 ASS 字幕自身样式
sub-ass-override = no
# ==================================================
# uosc 界面字体
# ==================================================
osd-font = Maple Mono Normal NF CN
# ==================================================
# 截图
# ==================================================
# 保存目录为设备专属配置，见 local.conf
screenshot-format = jpg
screenshot-jpeg-quality = 90
screenshot-template = mpv-shot-%F-%P
# ==================================================
# 设备专属覆盖
# ==================================================
# 新版 mpv 不再自动加载 mpv.local.conf，
# 通过 include 显式引入 local.conf（已在 .gitignore 中，不参与跨设备同步）
include = ~~home/local.conf
