# = =================================================
# 视频播放
# = =================================================
# 内置高质量配置
profile = high-quality
# 自动使用受支持的硬件解码
hwdec = auto
# 关闭 mpv 原生控制界面，由 uosc 接管
osc = no
# 禁止 mpv 原生进度条与 uosc 提示重叠
osd-bar = no
# 关闭系统边框，由 uosc 绘制顶部栏和窗口按钮
border = no
# 播放结束后保留最后一帧
keep-open = yes
# 退出时自动保存播放进度
save-position-on-quit = yes
# 窗口最大不超过屏幕的 90%
autofit-larger = 90%x90%
# 1.5 秒后隐藏鼠标
cursor-autohide = 1500
# = =================================================
# 音量与音轨
# = =================================================
# 防止音量拉得过高
volume-max = 100
# 中文优先，然后日语、英语
alang = zh-CN,zh-Hans,zh,zho,chi,ja,jpn,en,eng
# 自动加载同目录下的外部音频
audio-file-auto = fuzzy
# = =================================================
# 字幕
# = =================================================
# 字幕语言优先级
slang = zh-CN,zh-Hans,zh,zho,chi,en,eng
# 自动加载文件名相近的字幕
sub-auto = fuzzy
# 常见字幕子目录
sub-file-paths = sub:subs:subtitle:subtitles
# 普通文本字幕字体
sub-font = Maple Mono Normal NF CN
# 字幕大小
sub-font-size = 42
# 字幕描边
sub-border-size = 2
# 字幕纵向位置
sub-pos = 92
# 保留 ASS 字幕自身样式
sub-ass-override = no
# = =================================================
# uosc 界面字体
# = =================================================
osd-font = Maple Mono Normal NF CN
# = =================================================
# 截图
# = =================================================
screenshot-format = png
screenshot-template = mpv-shot-%F-%P
# 禁止 mpv 根据速度自动添加或删除变调滤镜
audio-pitch-correction = yes
# 始终保留音频变速滤镜
af = scaletempo2

watch-later-options-remove=audio-delay,video-zoom